<div
  #galleryTrack
  class="mt-8 flex snap-x snap-mandatory gap-3 overflow-x-auto scroll-smooth pb-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden lg:grid lg:grid-cols-4 lg:overflow-visible lg:pb-0"
  (scroll)="updateGalleryButtons(galleryTrack)"
>
  @for (item of galleryItems; track item.image) {
    <article class="basis-[88%] flex-none snap-start sm:basis-[calc(50%_-_0.5rem)] lg:basis-auto">
      <img
        [src]="item.image"
        [alt]="item.alt"
        class="aspect-[4/3] w-full rounded-xl object-cover"
      />

      <h3 class="mt-3 font-site text-base font-normal text-stone/85">
        {{ item.title }}
      </h3>
    </article>
  }
</div>

<div class="mt-4 flex justify-center gap-3 lg:hidden">
  <button
    type="button"
    aria-label="Previous gallery images"
    [disabled]="galleryAtStart"
    class="grid h-10 w-10 place-items-center rounded-full border border-gold text-gold transition hover:bg-gold hover:text-forest-dark disabled:cursor-not-allowed disabled:border-charcoal/25 disabled:text-charcoal/25 disabled:hover:bg-transparent"
    (click)="scrollGalleryPage(galleryTrack, -1)"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5">
      <path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <button
    type="button"
    aria-label="Next gallery images"
    [disabled]="galleryAtEnd"
    class="grid h-10 w-10 place-items-center rounded-full border border-gold text-gold transition hover:bg-gold hover:text-forest-dark disabled:cursor-not-allowed disabled:border-charcoal/25 disabled:text-charcoal/25 disabled:hover:bg-transparent"
    (click)="scrollGalleryPage(galleryTrack, 1)"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5">
      <path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</div>
